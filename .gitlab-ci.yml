image: node:22

stages:
  - lint
  - test
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm run format:check
    - npm run lint
    - npm run stylelint

unit:
  stage: test
  script:
    - npm run test -- --watch=false
  artifacts:
    when: always
    paths:
      - coverage/

component:
  stage: test
  script:
    - npx playwright install --with-deps chromium
    - npm run e2e
  artifacts:
    when: always
    paths:
      - playwright-report/

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/skillmate/browser/

pages:
  stage: deploy
  needs:
    - build
  script:
    - rm -rf public
    - cp -r dist/skillmate/browser public
  artifacts:
    paths:
      - public
  only:
    - main
