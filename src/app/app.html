<tui-root>
  <div class="app-shell">
    <header class="topbar" aria-label="Основная навигация">
      <a class="brand" routerLink="/dashboard" aria-label="SkillMate">
        <span class="brand__mark">SM</span>
        <span>SkillMate</span>
      </a>

      @if (auth.isAuthenticated()) {
        <nav class="topbar__nav" aria-label="Разделы приложения">
          <a routerLink="/dashboard" routerLinkActive="topbar__link--active" class="topbar__link"
            >Партнёры</a
          >
          <a routerLink="/profile" routerLinkActive="topbar__link--active" class="topbar__link"
            >Профиль</a
          >
          <a routerLink="/groups" routerLinkActive="topbar__link--active" class="topbar__link"
            >Группы</a
          >
        </nav>

        <div class="topbar__user">
          <span>{{ auth.session()?.user?.name }}</span>
          <button tuiButton size="s" appearance="secondary" type="button" (click)="logout()">
            Выйти
          </button>
        </div>
      }
    </header>

    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</tui-root>
